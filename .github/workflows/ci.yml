name: CI
on:
  push:
    branches:
      - main


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
      - name: install and run tests
        run: npm ci && npm test

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:Meesu_123@localhost:5432/urlShortenerDb"

      - name: Install dependencies
        run: npm ci

      - name: Run tests  
        run: npm test      